<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wishlist Deal Tracker</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --ink: #1a2330; --ink2: #55606e;
    --muted: #8a94a1; --line: #e7ebef; --line2: #eef1f4;
    --accent: #2f6fd0; --accent-bg: #eaf1fb;
    --sale: #0a7d5a; --sale-bg: #e6f5ef;
    --low: #9a6a00; --low-bg: #fbf1dc;
    --chart: #2f6fd0; --chart-fill: rgba(47,111,208,.12);
    --radius: 12px;
  }
  :root:not([data-theme="light"]) { @media (prefers-color-scheme: dark) {
    --bg: #0d1218; --card: #151c25; --ink: #e8edf3; --ink2: #aeb9c5;
    --muted: #7d8896; --line: #222d39; --line2: #1c2530;
    --accent: #6aa8ff; --accent-bg: #16283f;
    --sale: #35c99a; --sale-bg: #10322a; --low: #e0b055; --low-bg: #332a15;
    --chart: #6aa8ff; --chart-fill: rgba(106,168,255,.14);
  }}
  :root[data-theme="dark"] {
    --bg: #0d1218; --card: #151c25; --ink: #e8edf3; --ink2: #aeb9c5;
    --muted: #7d8896; --line: #222d39; --line2: #1c2530;
    --accent: #6aa8ff; --accent-bg: #16283f;
    --sale: #35c99a; --sale-bg: #10322a; --low: #e0b055; --low-bg: #332a15;
    --chart: #6aa8ff; --chart-fill: rgba(106,168,255,.14);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .wrap { max-width: 780px; margin: 0 auto; padding: 0 16px; }
  header { padding: 26px 0 8px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .mark { width: 30px; height: 30px; border-radius: 8px; background: var(--accent);
    display: grid; place-items: center; color: #fff; font-size: 17px; flex: none; }
  h1 { margin: 0; font-size: 21px; font-weight: 650; letter-spacing: .1px; }
  .topline { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .btn { font-size: 13px; font-weight: 600; color: var(--accent); background: var(--accent-bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; text-decoration: none; white-space: nowrap; }
  .btn:hover { border-color: var(--accent); }
  .meta { margin: 10px 2px 0; color: var(--ink2); font-size: 13px; }
  .meta a { color: var(--accent); text-decoration: none; }
  .meta a:hover { text-decoration: underline; }
  .fresh { display: inline-block; font-size: 12px; font-weight: 600; border-radius: 6px;
    padding: 1px 8px; background: var(--sale-bg); color: var(--sale); }
  .fresh.old { background: var(--low-bg); color: var(--low); }

  .stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin: 18px 0 4px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
  .stat .n { font-size: 22px; font-weight: 650; line-height: 1.1; }
  .stat .n.sale { color: var(--sale); }
  .stat .l { font-size: 12px; color: var(--muted); margin-top: 3px; }

  .banner { display: flex; gap: 10px; align-items: flex-start; background: var(--accent-bg);
    border: 1px solid var(--line); border-radius: var(--radius); padding: 11px 14px;
    color: var(--ink2); font-size: 13px; margin: 12px 0 2px; }
  .banner b { color: var(--ink); font-weight: 600; }

  .toolbar { display: flex; align-items: center; gap: 10px; margin: 18px 0 10px; flex-wrap: wrap; }
  .toolbar .grow { flex: 1; }
  select, .toggle { font: inherit; font-size: 13px; color: var(--ink); background: var(--card);
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; cursor: pointer; }
  .toggle { display: inline-flex; align-items: center; gap: 7px; user-select: none; }
  .toggle input { accent-color: var(--accent); }
  .count { font-size: 13px; color: var(--muted); }

  .list { display: flex; flex-direction: column; gap: 10px; padding-bottom: 48px; }
  .item { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px 14px; display: flex; align-items: center; gap: 14px; }
  .thumb { width: 56px; height: 56px; border-radius: 8px; background: #fff; border: 1px solid var(--line2);
    object-fit: contain; flex: none; }
  .thumb.ph { display: grid; place-items: center; color: var(--muted); font-weight: 600; font-size: 20px; background: var(--line2); }
  .body { flex: 1; min-width: 0; }
  .name { font-size: 14px; font-weight: 600; line-height: 1.35; margin: 0 0 5px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .name a { color: var(--ink); text-decoration: none; }
  .name a:hover { color: var(--accent); }
  .row2 { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; }
  .price { font-size: 18px; font-weight: 700; }
  .price.on { color: var(--sale); }
  .was { color: var(--muted); text-decoration: line-through; font-size: 13px; }
  .pill { font-size: 11.5px; font-weight: 700; border-radius: 6px; padding: 2px 7px; letter-spacing: .2px; }
  .pill.sale { background: var(--sale-bg); color: var(--sale); }
  .pill.low { background: var(--low-bg); color: var(--low); }
  .sub { color: var(--muted); font-size: 12px; }
  .spark { width: 108px; height: 42px; flex: none; }
  .spark.mini line { stroke: var(--line); }
  .foot { color: var(--muted); font-size: 12px; text-align: center; padding: 4px 0 40px; }
  .err { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px; color: #c0392b; }
  @media (max-width: 520px) {
    .stats { grid-template-columns: 1fr 1fr; }
    .stat:last-child { display: none; }
    .spark { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topline">
      <div class="brand"><div class="mark">◧</div><h1>Wishlist Deal Tracker</h1></div>
      <a class="btn" href="https://github.com/amir-gutterman/amazon-deal-notifier/actions/workflows/daily.yml"
         target="_blank" rel="noopener"
         title="Opens GitHub Actions in a new tab — click the grey ‘Run workflow’ button there to check prices now.">↻ Run now ↗</a>
    </div>
    <p class="meta" id="meta">Loading…</p>
  </header>
  <div class="stats" id="stats"></div>
  <div id="banner"></div>
  <div class="toolbar" id="toolbar" hidden>
    <label class="toggle"><input type="checkbox" id="dealsOnly"> Deals only</label>
    <select id="sort">
      <option value="drop">Sort: Biggest drop</option>
      <option value="plow">Price: low to high</option>
      <option value="phigh">Price: high to low</option>
      <option value="name">Name (A–Z)</option>
    </select>
    <span class="grow"></span>
    <span class="count" id="count"></span>
  </div>
  <div class="list" id="list"></div>
  <p class="foot" id="foot"></p>
</div>
<script>
const CUR = "€";
let ITEMS = [], SYM = CUR, THRESH = 5;

function money(n){ return SYM + Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }

function median(a){
  if (!a.length) return 0;
  const s = [...a].sort((x,y)=>x-y), m = s.length>>1;
  return s.length%2 ? s[m] : (s[m-1]+s[m])/2;
}

function relTime(iso){
  const mins = Math.round((Date.now() - new Date(iso).getTime())/60000);
  if (mins < 2) return "just now";
  if (mins < 60) return mins + " minutes ago";
  const hrs = Math.round(mins/60);
  if (hrs < 24) return hrs + (hrs===1 ? " hour ago" : " hours ago");
  const days = Math.round(hrs/24);
  return days === 1 ? "yesterday" : days + " days ago";
}

function sparkline(pts){
  const W=108,H=42,p=5,mn=Math.min(...pts),mx=Math.max(...pts),sp=(mx-mn)||1,n=pts.length;
  const x=i=>p+(n===1?(W-2*p)/2:i*(W-2*p)/(n-1)), y=v=>p+(1-(v-mn)/sp)*(H-2*p);
  const line=pts.map((v,i)=>x(i).toFixed(1)+","+y(v).toFixed(1)).join(" ");
  const area=p+","+(H-p)+" "+line+" "+x(n-1).toFixed(1)+","+(H-p);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="price trend">
    <polygon points="${area}" fill="var(--chart-fill)"/>
    <polyline points="${line}" fill="none" stroke="var(--chart)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(n-1).toFixed(1)}" cy="${y(pts[n-1]).toFixed(1)}" r="2.6" fill="var(--chart)"/></svg>`;
}
function sparkMini(){
  return `<svg class="spark mini" viewBox="0 0 108 42" preserveAspectRatio="none" role="img" aria-label="one reading so far">
    <line x1="5" y1="21" x2="103" y2="21" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="103" cy="21" r="2.6" fill="var(--chart)"/></svg>`;
}

function draw(){
  const dealsOnly = document.getElementById("dealsOnly").checked;
  const sort = document.getElementById("sort").value;
  let rows = ITEMS.slice();
  if (dealsOnly) rows = rows.filter(v => v.enough && v.off >= THRESH);
  rows.sort((a,b) =>
    sort==="plow" ? a.price-b.price :
    sort==="phigh" ? b.price-a.price :
    sort==="name" ? a.title.localeCompare(b.title) :
    (b.off-a.off || a.title.localeCompare(b.title)));

  document.getElementById("count").textContent =
    rows.length + (rows.length===1?" item":" items");

  document.getElementById("list").innerHTML = rows.map(v => {
    const chart = v.pts.length>1 ? sparkline(v.pts) : sparkMini();
    const initial = v.title.trim()[0] || "?";
    const thumb = v.image
      ? `<img class="thumb" src="${v.image}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'thumb ph',textContent:'${initial.replace(/'/g,"")}'}))">`
      : `<div class="thumb ph">${initial}</div>`;
    const onSale = v.enough && v.off >= THRESH;
    const pills =
      (onSale ? `<span class="pill sale">−${v.off.toFixed(0)}%</span>` : ``) +
      (onSale && v.atLow && v.pts.length>1 ? `<span class="pill low">Lowest ever</span>` : ``);
    const lowNote = (v.low < v.price - 1e-9)
      ? `<span class="sub">· lowest seen ${money(v.low)}</span>` : ``;
    const link = v.url ? `<a href="${v.url}" target="_blank" rel="noopener">${v.title}</a>` : v.title;
    return `<div class="item">
      ${thumb}
      <div class="body">
        <p class="name">${link}</p>
        <div class="row2">
          <span class="price ${onSale?'on':''}">${money(v.price)}</span>
          ${onSale ? `<span class="was">${money(v.ref)}</span>` : ``}
          ${pills}
          ${lowNote}
        </div>
      </div>
      ${chart}
    </div>`;
  }).join("");
}

function render(data, sym, wishlistUrl, threshold){
  SYM = sym || CUR;
  THRESH = (threshold != null) ? threshold : 5;
  ITEMS = Object.values(data).filter(v => v.last_price != null).map(v => {
    const pts = (v.price_history || []).map(p => p.price);
    // "was" price = the typical (median) price, robust to temporary spikes —
    // not the all-time max, which created phantom discounts.
    const base = median(pts.length ? pts : [v.last_price]);
    const low = pts.length ? Math.min(...pts) : v.last_price;
    return { title:v.title, url:v.url, image:v.image, price:v.last_price,
      ref: base, low, pts, last_seen:v.last_seen,
      off: base>0 ? (base - v.last_price)/base*100 : 0,
      atLow: v.last_price <= low + 1e-9,
      enough: pts.length >= 3 };
  });

  const onSale = ITEMS.filter(v => v.enough && v.off >= THRESH).length;
  const atLow = ITEMS.filter(v => v.atLow && v.pts.length>1).length;
  const enoughHistory = ITEMS.some(v => v.pts.length>1);
  const lastSeen = ITEMS.map(v=>v.last_seen).filter(Boolean).sort().pop();
  const when = lastSeen ? new Date(lastSeen).toLocaleString(undefined,
    {day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}) : "—";
  const stale = lastSeen && (Date.now() - new Date(lastSeen).getTime()) > 26*3600*1000;
  const fresh = lastSeen
    ? `<span class="fresh ${stale?'old':''}" title="Last checked ${when}">checked ${relTime(lastSeen)}</span>`
    : `<span class="fresh old">not checked yet</span>`;

  document.getElementById("meta").innerHTML =
    `${ITEMS.length} items · ${fresh}` +
    (wishlistUrl ? ` · <a href="${wishlistUrl}" target="_blank" rel="noopener">open wishlist ↗</a>` : ``);

  document.getElementById("stats").innerHTML = `
    <div class="stat"><div class="n">${ITEMS.length}</div><div class="l">Items tracked</div></div>
    <div class="stat"><div class="n ${onSale?'sale':''}">${onSale}</div><div class="l">On sale now</div></div>
    <div class="stat"><div class="n">${enoughHistory?atLow:"—"}</div><div class="l">At lowest ever</div></div>`;

  if (!enoughHistory) {
    document.getElementById("banner").innerHTML =
      `<div class="banner"><span>📈</span><span><b>Tracking has just begun.</b> Prices are checked once a day — trend charts and deal alerts will appear here over the next few days as history builds. You’ll also get an email the moment anything drops.</span></div>`;
  } else if (onSale === 0) {
    document.getElementById("banner").innerHTML =
      `<div class="banner"><span>✓</span><span>No deals right now — everything is at its usual price. We’ll email you when that changes.</span></div>`;
  }

  document.getElementById("toolbar").hidden = false;
  document.getElementById("dealsOnly").addEventListener("change", draw);
  document.getElementById("sort").addEventListener("change", draw);
  document.getElementById("foot").textContent =
    "Prices are a once-a-day snapshot, so Amazon may differ between checks — use “Run now” to refresh. " +
    "Grocery and produce items whose price loads via JavaScript aren’t tracked.";
  draw();
}

async function load(){
  try {
    const b = "?t=" + Date.now();
    const [pj, cj] = await Promise.all([
      fetch("prices.json"+b).then(r => r.ok ? r.json() : Promise.reject(r.status)),
      fetch("config.json"+b).then(r => r.ok ? r.json() : ({})).catch(()=>({})),
    ]);
    render(pj, cj && cj.currency_symbol, cj && cj.wishlist_url, cj && cj.min_discount_pct);
  } catch(e) {
    document.getElementById("meta").textContent = "Could not load price data.";
    document.getElementById("list").innerHTML =
      `<div class="err">Failed to load <code>prices.json</code> (${e}). If you just deployed, wait a minute for GitHub Pages to build, then refresh.</div>`;
  }
}
load();
</script>
</body>
</html>
